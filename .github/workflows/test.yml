# The gates on Linux and macOS, and on Linux under the Node floor of `engines`;
# the test suite on Windows; the install/uninstall cycle on all three. This is
# the only place the macOS and Windows paths run. Audio and the editor are not
# exercised: nothing plays a sound on a runner.
name: test
on: [push, pull_request]
# A branch push and its pull request share a group: the later run cancels the
# earlier one. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ready:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [""] # empty: the version Vite+ resolves
        include:
          - os: ubuntu-latest
            node: "22.18.0" # the floor in engines
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
        with:
          cache: true
          node-version: ${{ matrix.node }}
      - name: "node is the requested version"
        if: matrix.node != ''
        run: test "$(node --version)" = "v${{ matrix.node }}"
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run lines
      - run: vp run -r test
      - run: vp run -r build
      - run: vp run packcheck
  # The suite holds POSIX assumptions (file mode 0600, absolute paths written
  # with /): its result is reported and does not fail the workflow.
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - run: git config --global core.autocrlf false # the formatter and the hashes read LF
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
        with:
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run -r test
  install-cycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/claude-config
      XDG_CACHE_HOME: ${{ github.workspace }}/cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
        with:
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run -r build
      - run: node packages/qol-mini/dist/cli.js install --tab-state --warn 120000
      - run: node packages/qol-mini/dist/cli.js install --replace # keeps what is installed
      - run: node scripts/cycle.ts
      - run: node packages/qol-mini/dist/cli.js skills install npm-vulnerability-check ./project
      - run: node packages/qol-mini/dist/cli.js skills check ./project
      - run: node packages/qol-mini/dist/cli.js uninstall
      - run: node scripts/cycle.ts --uninstalled
