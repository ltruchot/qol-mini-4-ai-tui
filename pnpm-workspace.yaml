packages:
  - packages/*

catalogMode: prefer

# Exact pins only. Bump via `vp pm view <pkg> version`
catalog:
  "@clack/prompts": 1.7.0
  "@opencode/schema": 2.1.2
  "@types/node": 26.2.0
  "@vitest/coverage-v8": 5.1.0
  cac: 7.0.0
  effect: 4.0.1
  execa: 10.0.1
  jsonc-parser: 3.3.1
  node-diff3: 3.2.1
  picocolors: 1.1.1
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  yaml: 2.9.0
  zod: 4.4.3
  vitest: 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Vite+ owns the pnpm and Node versions (devEngines): pnpm neither switches itself nor
# manages the runtime.
pmOnFail: ignore
runtimeOnFail: ignore
# A release installs once it is three days old.
minimumReleaseAge: 4320
# Exact versions of the Vite+ 1.5.0 toolchain, younger than minimumReleaseAge when they
# were installed. Each line goes once its version is three days old.
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.0"
